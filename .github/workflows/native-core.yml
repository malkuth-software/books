name: Native library core checks
# On main the installable build already compiles and runs every one of these tests on
# all four platforms, so this matrix runs only for pull requests.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      # The harness at the commit harness.lock pins, at template_harness/.
      - name: Read the harness pin
        id: harness
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "repository=$(sed -n 's/^repository = "\(.*\)"$/\1/p' harness.lock)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' harness.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: runner.os == 'Windows'
        with:
          repository: ${{ steps.harness.outputs.repository }}
          ref: ${{ steps.harness.outputs.commit }}
          path: template_harness
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      # GUI.Forms' published MSYS2 CLANG64 tree (LLVM 22.1.8), restored by the
      # harness without the MSYS2 mirrors; it puts msys2.cmd on PATH.
      - name: Restore GUI.Forms' Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_WORKSPACE: ${{ github.workspace }}
          HARNESS_PROJECT: ${{ github.workspace }}/template_harness/projects/books.toml
        run: |
          test "$(git -C template_harness rev-parse HEAD)" = "${{ steps.harness.outputs.commit }}"
          python template_harness/harness/windows_toolchain.py restore
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure the portable library core
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAMES_BUILD_APPLICATION=OFF
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test the library core
        run: ctest --test-dir build --output-on-failure --timeout 180 --parallel 4 --output-junit results.xml -LE design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-${{ matrix.platform }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
